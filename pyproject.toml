[project]
name = "etf-forecast-mlops"
version = "0.1.0"
description = "MLOps pipeline for ETF volatility forecasting — ETL, training, FastAPI inference, and EKS deployment."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "pandas<=3.0.2",
    "pandas-ta>=0.3.14b0",
    "boto3>=1.43.6",
    "python-dotenv>=1.2.2",
    "mlflow>=3.12.0",
    "xgboost>=3.2.0",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "prometheus-client>=0.24.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

ui = [
    "streamlit>=1.57.0",
    "requests>=2.34.0"
]

airflow = [
    "scikit-learn>=1.8.0",
    "numpy>=1.24,<2.3",
    "xgboost>=3.2.0",
    "yfinance>=1.3.0",
    "fastparquet>=2026.3.0",
    "prometheus-client>=0.24.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "yfinance>=1.3.0",
    "xgboost>=3.2.0",
    "fastparquet>=2026.3.0",
    "black>=26.5.1",
    "ruff>=0.15.13",
]
