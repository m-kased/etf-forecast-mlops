name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - prod
      targets:
        description: "Comma-separated list of resources to destroy (e.g. module.eks,module.rds). Leave empty to destroy everything."
        required: false
        type: string
        default: ""
      confirm:
        description: "Type the environment name to confirm destruction"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        if: inputs.confirm != inputs.environment
        run: |
          echo "::error::Confirmation mismatch. You typed '${{ inputs.confirm }}' but selected '${{ inputs.environment }}'."
          exit 1

  destroy:
    name: Destroy (${{ inputs.environment }})
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: terraform/environments/${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Build target flags
        id: targets
        run: |
          TARGETS="${{ inputs.targets }}"
          FLAGS=""
          if [ -n "$TARGETS" ]; then
            IFS=',' read -ra ITEMS <<< "$TARGETS"
            for item in "${ITEMS[@]}"; do
              trimmed=$(echo "$item" | xargs)
              FLAGS="$FLAGS -target=$trimmed"
            done
          fi
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Terraform Plan Destroy
        run: terraform plan -destroy -no-color -input=false ${{ steps.targets.outputs.flags }}
        env:
          TF_VAR_project_name: ${{ vars.TF_VAR_PROJECT_NAME }}
          TF_VAR_environment: ${{ inputs.environment }}
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_availability_zones: ${{ vars.TF_VAR_AVAILABILITY_ZONES }}
          TF_VAR_airflow_git_repo: ${{ vars.TF_VAR_AIRFLOW_GIT_REPO }}

      - name: Terraform Destroy
        run: terraform destroy -input=false -auto-approve ${{ steps.targets.outputs.flags }}
        env:
          TF_VAR_project_name: ${{ vars.TF_VAR_PROJECT_NAME }}
          TF_VAR_environment: ${{ inputs.environment }}
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_availability_zones: ${{ vars.TF_VAR_AVAILABILITY_ZONES }}
          TF_VAR_airflow_git_repo: ${{ vars.TF_VAR_AIRFLOW_GIT_REPO }}
