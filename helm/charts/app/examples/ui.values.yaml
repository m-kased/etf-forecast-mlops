# Streamlit UI — use with: helm upgrade --install ui ./charts/app -f examples/ui.values.yaml

namespace: app

image:
  repository: ""
  tag: ""

containerPort: 8501

service:
  port: 8501

serviceAccount:
  name: ui

env:
  - name: API_URL
    value: "http://api.app.svc.cluster.local:8000"

envFrom:
  - secretRef:
      name: app-rds-credentials

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /_stcore/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /_stcore/health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10

istio:
  enabled: true
  gateway:
    name: istio-ingressgateway
    namespace: istio-system
  hosts:
    - etf-forecast-mlops.mohamed-elkased.com
  prefix: /
