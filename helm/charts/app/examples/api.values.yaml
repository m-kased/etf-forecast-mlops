namespace: app

image:
  repository: ""  # set in CI, e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com/etf-forecast-api
  tag: ""

containerPort: 8000

service:
  port: 8000

serviceAccount:
  name: api
  annotations: {}
  # eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/etf-forecast-dev-api

env:
  - name: MLFLOW_TRACKING_URI
    value: "http://mlflow.mlflow.svc.cluster.local:5000"
  - name: AWS_DEFAULT_REGION
    value: "us-east-1"

envFrom:
  - secretRef:
      name: app-rds-credentials

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
