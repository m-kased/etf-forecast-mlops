{{- if and .Values.istio.enabled .Values.istio.hosts }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ include "app.fullname" . }}
  namespace: {{ include "app.namespace" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  hosts:
    {{- range .Values.istio.hosts }}
    - {{ . | quote }}
    {{- end }}
  gateways:
    - {{ .Values.istio.gateway.namespace }}/{{ .Values.istio.gateway.name }}
  http:
    - match:
        - uri:
            prefix: {{ .Values.istio.prefix }}
      {{- with .Values.istio.rewrite }}
      rewrite:
        uri: {{ . }}
      {{- end }}
      route:
        - destination:
            host: {{ include "app.fullname" . }}
            port:
              number: {{ include "app.servicePort" . | int }}
{{- end }}
