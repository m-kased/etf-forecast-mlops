# Generic application chart — override per workload (see examples/api.values.yaml, ui.values.yaml).

# -- Application identity
name: ""
namespace: app

commonLabels: {}
podAnnotations: {}

# -- Pod security
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

imagePullSecrets: []
replicaCount: 1

# -- Container image
image:
  repository: ""  # required — set in CI or -f values overlay
  tag: ""         # defaults to Chart.appVersion when empty
  pullPolicy: IfNotPresent

containerPort: 8080

# -- Kubernetes Service
service:
  enabled: true
  type: ClusterIP
  port: ""  # defaults to containerPort

# -- Service account (IRSA annotations set in workload-specific values)
serviceAccount:
  create: true
  name: ""
  annotations: {}

# -- Runtime configuration
env: []
envFrom: []

resources: {}
#  requests:
#    cpu: 100m
#    memory: 256Mi
#  limits:
#    memory: 512Mi

livenessProbe: {}
readinessProbe: {}

nodeSelector: {}
tolerations: []
affinity: {}

# -- Istio ingress (VirtualService)
istio:
  enabled: false
  gateway:
    name: istio-ingressgateway
    namespace: istio-system
  hosts: []
  prefix: /
  rewrite: ""
