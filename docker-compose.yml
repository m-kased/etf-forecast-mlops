# This anchor lets us reuse AWS credentials across multiple containers cleanly
x-aws-env: &aws-env
  AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
  AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
  AWS_DEFAULT_REGION: us-east-1

x-airflow-common: &airflow-common
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  # Airflow 3.0: LocalExecutor task subprocesses call the execution API (task logs + callbacks).
  # This stack uses `airflow ... standalone` (one container): use localhost, not airflow-webserver.
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://localhost:8080/execution/"
  # Shared JWT signing keys — MUST be identical on scheduler and api-server.
  # The scheduler signs task tokens with [api_auth] jwt_secret; the api-server validates them.
  # If left unset each container generates its own random key → "Signature verification failed".
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
  AIRFLOW__CORE__INTERNAL_API_SECRET_KEY: ${AIRFLOW_INTERNAL_API_SECRET_KEY}
  # Airflow 3.0 Simple Auth Manager — define users (username:role) and password file
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_SIMPLE_AUTH_MANAGER_USERS}
  # ETL pipeline env vars (same values as K8s)
  MINIO_ENDPOINT: http://minio:9000
  # Optional: host in presigned GET URLs (browser). Empty → same as MINIO_ENDPOINT (in-cluster only).
  MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
  MINIO_PRESIGNED_EXPIRES: ${MINIO_PRESIGNED_EXPIRES:-86400}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
  AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
  AWS_DEFAULT_REGION: us-east-1
  MLFLOW_S3_ENDPOINT_URL: http://minio:9000
  MLFLOW_TRACKING_URI: http://mlflow:5000
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ml_data
  API_BASE_URL: http://api:8000
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "" # Docker Compose Redis has no auth
  PYTHONPATH: /opt/airflow/dags:/opt/airflow/dags/ml:/opt/airflow/src:/opt/airflow

services:
  # PostgreSQL — metadata for MLflow & Airflow
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ml_data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      retries: 5

  # DB migrations — runs on every compose-up (idempotent SQL)
  db-init:
    image: postgres:15-alpine
    volumes:
      - ./docker/postgres-migrations.sql:/migrations.sql:ro
    entrypoint: ["sh", "-c"]
    command:
      - psql "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ml_data" -f /migrations.sql
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
  # Adminer — database management tool
  adminer:
    image: adminer:latest
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # MinIO — S3-compatible storage for raw data + model artifacts
  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 5

  # Redis — feature caching for inference (used by MLflow)
  redis:
    image: redis:7-alpine
    container_name: ml-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MLflow — model registry & tracking
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.12.0-full
    ports:
      - "5000:5000"
    environment:
      <<: *aws-env
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command: >
      mlflow server 
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ml_data 
      --default-artifact-root s3://mlflow-artifacts/ 
      --host 0.0.0.0 --allowed-hosts "*" --port 5000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: ml-airflow-init
    volumes:
      - ./src:/opt/airflow/src
      - ./dags:/opt/airflow/dags
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common
    # Create required Airflow pools so pipelines run without manual setup
    command: >
      bash -c "
        airflow db migrate &&
        airflow pools set binance_api_pool 5 'Rate limiter for Binance API calls' &&
        airflow pools set postgres_pool 5 'Rate limiter for PostgreSQL load operations' &&
        airflow pools set ml_training_pool 3 'ML training concurrency limit' &&
        echo 'Init complete'
      "
    restart: "no"

  # Airflow — orchestration for ETL & model training
  airflow:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    environment:
      <<: *airflow-common
    ports:
      - "8080:8080"
    volumes:
      - ./src:/opt/airflow/src
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: standalone
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY}
      - AWS_DEFAULT_REGION=us-east-1
      - MLFLOW_S3_ENDPOINT_URL=${MLFLOW_S3_ENDPOINT_URL}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ml_data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mlflow:
        condition: service_started

  ui:
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
      - ./src/common:/app/src/common
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ml_data
      - API_URL=http://api:8000
    depends_on:
      - api
      - postgres

volumes:
  postgres_data:
  minio_data:

networks:
  default:
    name: ml-network
